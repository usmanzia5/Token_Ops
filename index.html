<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WaferZero Pitch Deck</title>
<meta name="description" content="WaferZero. The economic layer for AI in chip verification." />
<style>
  :root{
    --bg:#FAF8F3;
    --panel:#F2ECE0;
    --panel-soft:#F6F1E8;
    --ink:#1F1E1B;
    --ink-soft:#6B6357;
    --ink-faint:#9C9384;
    --accent:#D97757;
    --accent-deep:#C15F3C;
    --line:#E7E0D2;
    --line-strong:#DAD1BF;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* Header */
  header{
    flex:0 0 auto;
    padding:26px 24px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--bg),rgba(250,248,243,0.6));
  }
  .wordmark{
    font-family:var(--serif);
    font-size:22px;
    letter-spacing:.2px;
    font-weight:600;
    color:var(--ink);
    user-select:none;
  }
  .wordmark .dot{color:var(--accent)}
  .wordmark .sub{
    display:block;
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:5px;
    font-weight:500;
  }

  /* Nav dots */
  nav.dots{
    margin-top:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:11px;
    flex-wrap:wrap;
  }
  .dot-btn{
    position:relative;
    width:12px;height:12px;
    border-radius:50%;
    border:1.5px solid var(--line-strong);
    background:transparent;
    cursor:pointer;
    padding:0;
    transition:transform .18s ease,background .18s ease,border-color .18s ease;
  }
  .dot-btn:hover{border-color:var(--accent);transform:scale(1.25)}
  .dot-btn.active{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
  .dot-btn.sep{margin-left:16px;position:relative}
  .dot-btn.sep::before{
    content:"";
    position:absolute;left:-9px;top:50%;
    width:1px;height:14px;transform:translateY(-50%);
    background:var(--line-strong);
  }
  .dot-btn .tip{
    position:absolute;top:22px;left:50%;transform:translateX(-50%) translateY(4px);
    background:var(--ink);color:#fff;
    font-size:11px;line-height:1;letter-spacing:.02em;
    padding:6px 8px;border-radius:6px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;
    z-index:20;
  }
  .dot-btn:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Stage */
  main{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  .slide{
    position:absolute;
    width:100%;
    max-width:860px;
    padding:0 8px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .45s ease,transform .45s ease;
    pointer-events:none;
    max-height:100%;
    overflow-y:auto;
  }
  .slide.active{opacity:1;transform:translateY(0);pointer-events:auto}

  .eyebrow{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent-deep);font-weight:600;margin-bottom:18px;
  }
  .slide h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(30px,4.6vw,50px);
    line-height:1.08;
    letter-spacing:-.01em;
    margin-bottom:22px;
  }
  .slide h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(26px,3.8vw,40px);
    line-height:1.14;
    letter-spacing:-.01em;
    margin-bottom:26px;
  }
  .slide p{
    font-size:clamp(16px,1.9vw,19px);
    line-height:1.62;
    color:var(--ink-soft);
    margin-bottom:16px;
    max-width:66ch;
  }
  .slide p strong{color:var(--ink);font-weight:600}
  .lead{color:var(--ink) !important;font-size:clamp(17px,2vw,20px) !important}

  .emph{
    font-family:var(--serif);
    font-style:italic;
    color:var(--ink) !important;
    font-size:clamp(18px,2.2vw,23px) !important;
    line-height:1.4;
    margin-top:22px;
    padding-left:20px;
    border-left:3px solid var(--accent);
  }

  ul.clean{list-style:none;margin:8px 0 4px}
  ul.clean li{
    position:relative;
    padding-left:26px;
    font-size:clamp(15.5px,1.8vw,18px);
    line-height:1.55;
    color:var(--ink-soft);
    margin-bottom:15px;
    max-width:64ch;
  }
  ul.clean li strong{color:var(--ink)}
  ul.clean li::before{
    content:"";
    position:absolute;left:2px;top:11px;
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
  }

  ol.num{list-style:none;counter-reset:n;margin:10px 0}
  ol.num li{
    position:relative;counter-increment:n;
    padding-left:44px;margin-bottom:18px;
    font-size:clamp(15.5px,1.8vw,18px);line-height:1.5;color:var(--ink-soft);
    max-width:66ch;
  }
  ol.num li strong{color:var(--ink)}
  ol.num li::before{
    content:counter(n);
    position:absolute;left:0;top:-2px;
    width:28px;height:28px;border-radius:50%;
    background:var(--panel);color:var(--accent-deep);
    border:1px solid var(--line-strong);
    font-family:var(--serif);font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }

  .callout{
    background:var(--panel-soft);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:10px;
    padding:20px 22px;
    margin:22px 0 8px;
  }
  .callout .k{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin-bottom:10px;
  }
  .callout p{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:clamp(16px,1.9vw,19px);line-height:1.5;margin:0}

  table.grid{border-collapse:collapse;width:100%;margin:14px 0 6px;font-size:clamp(13.5px,1.5vw,15.5px)}
  table.grid th,table.grid td{
    text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45;
  }
  table.grid th{
    color:var(--ink);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    border-bottom:1.5px solid var(--line-strong);
  }
  table.grid td:first-child{color:var(--ink);font-weight:600;width:38%}
  table.grid td:last-child{color:var(--ink-soft)}
  table.grid tr:last-child td{border-bottom:none}

  .moat{
    margin-top:20px;padding:16px 20px;border-radius:10px;
    background:linear-gradient(180deg,rgba(217,119,87,0.08),rgba(217,119,87,0.03));
    border:1px solid rgba(217,119,87,0.25);
    font-size:clamp(15px,1.7vw,17px);line-height:1.5;color:var(--ink);
  }
  .moat b{color:var(--accent-deep)}
  .tbd{color:var(--ink-faint);font-style:italic;font-size:14px}

  /* Product diagram */
  .product-diagram{
    display:grid;
    grid-template-columns:minmax(0,1fr) 52px minmax(220px,.92fr) 52px minmax(0,1fr);
    gap:14px;
    align-items:center;
    margin-top:18px;
  }
  .diagram-stack{display:grid;gap:12px}
  .diagram-card{
    min-height:78px;
    border:1px solid var(--line);
    background:rgba(246,241,232,.78);
    border-radius:8px;
    padding:15px 16px;
    overflow-wrap:break-word;
  }
  .diagram-card.source{border-left:3px solid #8B7D6B}
  .diagram-card.outcome{border-left:3px solid #6F8F8A}
  .diagram-card.result{border-left:3px solid var(--accent)}
  .diagram-kicker{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:700;
    margin-bottom:7px;
  }
  .diagram-title{
    font-size:clamp(14px,1.55vw,16px);
    line-height:1.25;
    color:var(--ink);
    font-weight:650;
    margin-bottom:5px;
  }
  .diagram-copy{
    font-size:clamp(12.5px,1.35vw,14px);
    line-height:1.38;
    color:var(--ink-soft);
  }
  .diagram-hub{
    position:relative;
    border:1px solid rgba(217,119,87,.34);
    background:linear-gradient(180deg,rgba(217,119,87,.13),rgba(246,241,232,.9));
    border-radius:8px;
    padding:18px 18px 16px;
    min-height:254px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    box-shadow:0 18px 38px rgba(31,30,27,.06);
  }
  .diagram-hub .diagram-title{
    font-family:var(--serif);
    font-size:clamp(20px,2.35vw,25px);
    font-weight:600;
    margin-bottom:10px;
  }
  .hub-steps{
    display:grid;
    gap:8px;
    margin-top:14px;
  }
  .hub-step{
    border:1px solid rgba(217,119,87,.24);
    background:rgba(250,248,243,.7);
    border-radius:999px;
    padding:8px 11px;
    font-size:12px;
    color:var(--ink);
    font-weight:650;
  }
  .flow-arrow{
    color:var(--accent-deep);
    font-family:var(--serif);
    font-size:30px;
    line-height:1;
    text-align:center;
    opacity:.85;
  }
  .diagram-proof{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
    margin-top:18px;
  }
  .proof-pill{
    min-height:68px;
    border:1px solid var(--line);
    background:var(--panel-soft);
    border-radius:8px;
    padding:12px 13px;
    overflow-wrap:break-word;
  }
  .proof-pill strong{
    display:block;
    color:var(--ink);
    font-size:14px;
    line-height:1.2;
    margin-bottom:5px;
  }
  .proof-pill span{
    display:block;
    color:var(--ink-soft);
    font-size:12.5px;
    line-height:1.3;
  }

  /* Outcome actions */
  .action-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-top:22px;
  }
  .action-card{
    min-height:118px;
    border:1px solid var(--line);
    background:var(--panel-soft);
    border-radius:8px;
    padding:17px 18px;
    overflow-wrap:break-word;
  }
  .action-card.priority{
    border-color:rgba(217,119,87,.32);
    background:linear-gradient(180deg,rgba(217,119,87,.1),rgba(246,241,232,.86));
  }
  .action-num{
    font-family:var(--serif);
    font-size:20px;
    line-height:1;
    color:var(--accent-deep);
    margin-bottom:10px;
    font-weight:600;
  }
  .action-title{
    font-size:clamp(15px,1.7vw,17px);
    line-height:1.22;
    color:var(--ink);
    font-weight:650;
    margin-bottom:7px;
  }
  .action-copy{
    font-size:clamp(13.5px,1.45vw,15px);
    line-height:1.45;
    color:var(--ink-soft);
  }

  /* Title slide */
  .hero{text-align:center}
  .hero .brand{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(46px,8vw,86px);line-height:1;letter-spacing:-.02em;margin-bottom:20px;
  }
  .hero .brand .dot{color:var(--accent)}
  .hero .tag{
    font-family:var(--serif);font-size:clamp(20px,2.8vw,30px);color:var(--ink);
    line-height:1.25;margin-bottom:22px;font-weight:500;
  }
  .hero .oneliner{
    font-size:clamp(15px,1.8vw,18px);color:var(--ink-soft);max-width:60ch;margin:0 auto 30px;line-height:1.6;
  }
  .hero .meta{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;
  }

  /* Footer controls */
  footer{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:22px;
    padding:16px 24px 22px;
  }
  .ctrl{
    width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line-strong);background:transparent;color:var(--ink-soft);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .16s ease;
  }
  .ctrl:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--panel-soft)}
  .counter{
    font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.14em;color:var(--ink-faint);
    min-width:96px;text-align:center;font-weight:600;
  }
  .counter .name{display:block;text-transform:none;letter-spacing:.01em;color:var(--ink-soft);font-size:12px;margin-top:3px;font-weight:500}

  .kbd-hint{
    position:fixed;left:20px;bottom:22px;z-index:10;
    font-size:11.5px;color:var(--ink-faint);letter-spacing:.02em;
  }
  .kbd-hint b{color:var(--ink-soft);font-weight:600}

  @media (max-width:760px){
    .product-diagram{
      grid-template-columns:1fr;
      gap:10px;
      margin-top:14px;
    }
    .diagram-stack{gap:10px}
    .diagram-card{min-height:auto;padding:13px 14px}
    .diagram-hub{min-height:auto;padding:16px 14px}
    .flow-arrow{font-size:22px;transform:rotate(90deg)}
    .diagram-proof{grid-template-columns:1fr;gap:8px;margin-top:12px}
    .proof-pill{min-height:auto}
    .action-grid{grid-template-columns:1fr;gap:10px}
    .action-card{min-height:auto;padding:15px 16px}
  }

  @media (max-width:640px){
    header{padding:18px 16px 14px}
    nav.dots{gap:9px}
    .kbd-hint{display:none}
    .slide{padding:0 16px}
    table.grid td:first-child{width:auto}
    .action-grid{gap:8px;margin-top:16px}
    .action-card{padding:12px 13px}
    .action-num{font-size:17px;margin-bottom:7px}
    .action-title{font-size:15px;margin-bottom:5px}
    .action-copy{font-size:13px;line-height:1.34}
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">WaferZero<span class="dot">.</span>
    <span class="sub">The economic layer for AI in chip verification</span>
  </div>
  <nav class="dots" id="dots" aria-label="Slide navigation"></nav>
</header>

<main id="stage"></main>

<footer>
  <button class="ctrl" id="prev" aria-label="Previous slide">‹</button>
  <div class="counter"><span id="count">01 / 15</span><span class="name" id="cur-name">Title</span></div>
  <button class="ctrl" id="next" aria-label="Next slide">›</button>
</footer>

<div class="kbd-hint">Use <b>←</b> <b>→</b> to move between slides</div>

<script>
const slides = [
  {
    label:"Title", n:"01",
    html:`<div class="hero">
      <div class="brand">WaferZero<span class="dot">.</span></div>
      <div class="tag">The economic layer for AI in chip verification.</div>
      <div class="oneliner">We connect AI spend to verified engineering outcomes, so chip teams can finally see which AI tools produce verified silicon and what each result actually costs.</div>
      <div class="meta">Pre-seed</div>
    </div>`
  },
  {
    label:"Problem", n:"02",
    html:`<div class="eyebrow">The Problem</div>
      <h2>Companies are scaling their fastest-growing cost with their eyes closed.</h2>
      <p class="lead">AI spend is now the fastest-growing, highest-variance line in engineering.</p>
      <p>Teams can't tell value from waste, so they either let it run or cap their best work with a blind budget.</p>
      <p>The same agent task can cost <strong>30&times; more</strong> from one run to the next, and the expensive runs are often the <em>worse</em> ones.</p>
      <p class="emph">The problem isn't that AI costs too much. It's that management can't decide where to cut and where to invest.</p>`
  },
  {
    label:"The Insight", n:"03",
    html:`<div class="eyebrow">The Insight: why us, why now</div>
      <h2>In software this is a race. In silicon it's open ground.</h2>
      <p>Tying AI spend to output in software (pull requests, tickets, deploys) is getting solved. That data is clean, public, and API-first.</p>
      <p>In chip verification, the outcomes that matter (<strong>coverage, bugs, regression health</strong>) sit inside proprietary EDA tools, connected to nothing.</p>
      <p>Nobody has claimed it. And we've spent our careers inside it.</p>
      <p class="emph">&ldquo;The outcome data lives in tools nobody has connected yet. That's the whole opportunity.&rdquo;</p>`
  },
  {
    label:"Solution", n:"04",
    html:`<div class="eyebrow">Solution / Product</div>
      <h2>A cost-per-verified-outcome report for chip teams.</h2>
      <p class="lead">WaferZero sits next to a verification team and reads two things they already have:</p>
      <ul class="clean">
        <li><strong>Their AI usage and billing:</strong> which agents ran, how many tokens, what it cost.</li>
        <li><strong>Their verification results:</strong> which regressions failed, which root causes engineers accepted, which reruns passed, how coverage moved.</li>
      </ul>
      <p>It matches them up and answers one question they can't answer today: <strong>what did each verified result actually cost, and which agents are worth the money?</strong></p>
      <div class="callout"><div class="k">What you'd see on screen</div>
        <p>&ldquo;The triage assistant burned $18,400 last quarter and produced 96 accepted root causes and 74 passing reruns. That's $192 per accepted root cause. A second workflow spent $7,800 for 4 outcomes. Pause it.&rdquo;</p></div>
      <p>We land <strong>read-only</strong> (they send exports, we send back the report), then grow into the live control plane.</p>`
  },
  {
    label:"Product Map", n:"05",
    html:`<div class="eyebrow">Product Map</div>
      <h2>WaferZero joins token spend to verified outcomes.</h2>
      <p class="lead">The product is the neutral layer between AI activity and the verification systems that already know whether the work mattered.</p>
      <div class="product-diagram" aria-label="WaferZero product flow diagram">
        <div class="diagram-stack">
          <div class="diagram-card source">
            <div class="diagram-kicker">AI spend</div>
            <div class="diagram-title">Internal agents</div>
            <div class="diagram-copy">Failure triage bots, testbench generators, assertion writers.</div>
          </div>
          <div class="diagram-card source">
            <div class="diagram-kicker">Vendor tools</div>
            <div class="diagram-title">EDA copilots</div>
            <div class="diagram-copy">Cadence, Synopsys, Siemens, and future agentic flows.</div>
          </div>
          <div class="diagram-card outcome">
            <div class="diagram-kicker">Outcome data</div>
            <div class="diagram-title">Regression + coverage</div>
            <div class="diagram-copy">Failures, accepted root causes, passing reruns, coverage movement.</div>
          </div>
        </div>
        <div class="flow-arrow" aria-hidden="true">&rarr;</div>
        <div class="diagram-hub">
          <div class="diagram-kicker">WaferZero</div>
          <div class="diagram-title">The ROI Join</div>
          <div class="diagram-copy">Match each agent run to the verification result it helped create.</div>
          <div class="hub-steps">
            <div class="hub-step">Meter tokens</div>
            <div class="hub-step">Link outcomes</div>
            <div class="hub-step">Score value</div>
          </div>
        </div>
        <div class="flow-arrow" aria-hidden="true">&rarr;</div>
        <div class="diagram-stack">
          <div class="diagram-card result">
            <div class="diagram-kicker">Visibility</div>
            <div class="diagram-title">Agent-level economics</div>
            <div class="diagram-copy">Person, team, model, tool, workflow, tokens, cost, and accepted result.</div>
          </div>
          <div class="diagram-card result">
            <div class="diagram-kicker">ROI output</div>
            <div class="diagram-title">Renew, expand, pause</div>
            <div class="diagram-copy">Budget moves, vendor decisions, internal benchmarks, and agent controls.</div>
          </div>
        </div>
      </div>
      <div class="diagram-proof">
        <div class="proof-pill"><strong>$192</strong><span>per accepted root cause</span></div>
        <div class="proof-pill"><strong>$249</strong><span>per resolved failure</span></div>
        <div class="proof-pill"><strong>$7,800</strong><span>spent for 4 outcomes: pause</span></div>
      </div>`
  },
  {
    label:"What Teams Do", n:"06",
    html:`<div class="eyebrow">Product Value</div>
      <h2>It turns AI usage into operating decisions.</h2>
      <p class="lead">WaferZero is not a &ldquo;good to know&rdquo; dashboard. The output is a decision list for verification leadership.</p>
      <div class="action-grid">
        <div class="action-card priority">
          <div class="action-num">01</div>
          <div class="action-title">Reallocate AI budget</div>
          <div class="action-copy">Move spend toward agents, teams, and vendors with the lowest cost per accepted outcome.</div>
        </div>
        <div class="action-card">
          <div class="action-num">02</div>
          <div class="action-title">Renew, renegotiate, or cancel</div>
          <div class="action-copy">Justify tool decisions with cost per resolved failure, not usage charts or anecdotes.</div>
        </div>
        <div class="action-card">
          <div class="action-num">03</div>
          <div class="action-title">Benchmark internal performance</div>
          <div class="action-copy">Compare models, prompts, workflows, teams, and projects on verified engineering progress.</div>
        </div>
        <div class="action-card priority">
          <div class="action-num">04</div>
          <div class="action-title">Stop waste before it compounds</div>
          <div class="action-copy">Identify no-outcome spend first; later cap low-value agents and kill runaway loops automatically.</div>
        </div>
      </div>

// Render
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
const countEl = document.getElementById('count');
const nameEl = document.getElementById('cur-name');
let idx = 0;

slides.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className = 'slide' + (i===0?' active':'');
  sec.innerHTML = s.html;
  stage.appendChild(sec);

  const b = document.createElement('button');
  b.className = 'dot-btn' + (i===0?' active':'') + (s.sep?' sep':'');
  b.setAttribute('aria-label', s.label);
  b.innerHTML = `<span class="tip">${s.n} · ${s.label}</span>`;
  b.addEventListener('click',()=>go(i));
  dotsWrap.appendChild(b);
});

const slideEls = [...document.querySelectorAll('.slide')];
const dotEls = [...document.querySelectorAll('.dot-btn')];

function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  slideEls[idx].classList.remove('active');
  dotEls[idx].classList.remove('active');
  idx = i;
  slideEls[idx].classList.add('active');
  slideEls[idx].scrollTop = 0;
  dotEls[idx].classList.add('active');
  countEl.textContent = `${slides[idx].n} / ${slides.length.toString().padStart(2,'0')}`;
  nameEl.textContent = slides[idx].label;
}

document.getElementById('prev').addEventListener('click',()=>go(idx-1));
document.getElementById('next').addEventListener('click',()=>go(idx+1));

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(idx+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(idx-1)}
  else if(e.key==='Home'){go(0)}
  else if(e.key==='End'){go(slides.length-1)}
});
</script>
